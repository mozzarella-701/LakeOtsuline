<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAKE LOADs（非公式）大津線リアルタイム時刻表</title>
<style>
:root{--bg:#fff;--fg:#1c2330;--sub:#667085;--line:#e3e7ee;--acc:#0b6bcb;--late:#c2410c;--card:#f6f8fb}
@media(prefers-color-scheme:dark){:root{--bg:#10151d;--fg:#e8ecf3;--sub:#9aa6b8;--line:#263041;--acc:#6db3ff;--late:#fb923c;--card:#171e29}}
body{margin:0;font:15px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:18px;margin:6px 0 2px}
.s{color:var(--sub);font-size:12px}
.warn{background:var(--card);border-left:3px solid var(--late);padding:6px 10px;font-size:12px;margin:8px 0}
header{background:#0b72b9;color:#fff;display:flex;justify-content:center;align-items:center;position:relative;padding:14px 0;font-weight:700;font-size:17px;letter-spacing:.05em}
header button{position:absolute;right:10px;border:0;background:none;color:#fff;font-size:22px}
main{padding-bottom:84px}
.my{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 8px}
.lnk{color:var(--acc);font-size:13px;cursor:pointer}
.chip{display:inline-block;margin:0 6px 8px 0;padding:7px 14px;border:2px solid var(--line);border-radius:22px;background:var(--bg);cursor:pointer}
.chip.on{border-color:var(--acc);font-weight:700}.chip i{font-style:normal;margin-left:6px;color:var(--sub)}
.card{background:var(--card);border-radius:12px;padding:10px;margin-top:4px}
.ch{display:flex;align-items:center;gap:8px;margin:2px 2px 8px}.ch .tg{margin-left:auto}
.badge{border:1px solid #f0b34a;background:#fff4dc;color:#7a4a00;border-radius:6px;padding:2px 8px;font-size:12px}
.band{background:#6f7f95;color:#fff;padding:6px 10px;font-weight:700;font-size:13px;border-radius:6px 6px 0 0;margin-top:8px}
.rw{display:flex;align-items:center;gap:12px;padding:9px 12px;background:var(--bg);border-bottom:1px solid var(--line);cursor:pointer}
.tm{min-width:58px}.tm s{display:block;color:var(--sub);font-size:12px}.tm b{font-size:19px;font-variant-numeric:tabular-nums}
.wide{width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.gr{display:flex;flex-wrap:wrap;gap:6px}.gr span{padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-variant-numeric:tabular-nums;cursor:pointer}
#fr,#to{max-width:42%}
.go{width:100%;margin-top:10px;padding:12px;border:0;border-radius:24px;background:#0b72b9;color:#fff;font:inherit;font-weight:700}
.rh{display:flex;align-items:center;gap:8px;padding:6px 0}
.tabs{display:flex;border-bottom:2px solid var(--line);margin:8px 0}
.tbn{flex:1;text-align:center;padding:9px 0;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tbn.on{color:var(--acc);border-color:var(--acc);font-weight:700}.tbn.dis{opacity:.4;cursor:default}
.rtb{background:var(--card);text-align:center;color:var(--sub);padding:7px;font-size:13px;cursor:pointer;border-radius:6px;margin:6px 0}
.rc{background:var(--bg);border-radius:12px;padding:14px;margin:10px 0;border:1px solid var(--line);cursor:pointer}
.rc .tt{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.rc .mt{color:var(--sub);margin-top:4px}
.rc .lg{display:inline-block;margin:8px 6px 0 0;padding:2px 8px;border-radius:6px;color:#fff;font-size:12px}
.tb{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);z-index:5}
.tb button{flex:1;padding:10px 0 16px;border:0;background:none;color:var(--sub);font:inherit}.tb button.on{color:var(--acc);font-weight:700}
select,input{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
h2{font-size:14px;margin:16px 0 6px;color:var(--sub)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--card)}
.t{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.late{color:var(--late)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:4px}.bar i{display:block;height:4px;background:var(--acc);border-radius:2px}
.tap{cursor:pointer}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
#sh.on{display:flex}
#sh>div{background:var(--bg);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:14px 14px 0 0;padding:12px 14px 24px}
.st{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--line)}
.st.past{color:var(--sub)}.st.now{background:var(--card);font-weight:700}
.dg svg{display:block;width:100%;max-width:420px;margin:0 auto}
</style></head><body><header>LAKE LOADs<button id="rf" aria-label="更新">⟳</button></header>
<main>
<p class="s">京阪電車の公式サービスではありません。時刻表をもとにした推定で、実際の運行とは異なる場合があります。</p>
<div class="warn" id="dayinfo"></div>
<label class="s">時刻を指定（空欄＝現在） <input id="tm" type="time"></label>
<label class="s">　ダイヤ <select id="dy"><option value="">自動</option><option value="weekday">平日</option><option value="holiday">土休日</option></select></label>
<div id="p1">
<div class="my"><span><b>マイ駅</b> <span class="s" id="clk"></span></span><span class="lnk" id="addb">他の駅を探す ›</span></div>
<div id="addp" hidden><select id="st" aria-label="駅"></select></div>
<div id="chips"></div><div id="o1"></div>
</div>
<div id="p2" hidden><div id="o2"></div></div>
<div id="p3" hidden>
<div id="f3"><h2>経路検索</h2><div class="card">
<div class="my"><select id="fr" aria-label="出発駅"></select><span class="lnk" id="sw">⇄</span><select id="to" aria-label="到着駅"></select></div>
<div class="s" id="tmv" style="margin:6px 2px"></div><div class="s" style="margin:0 2px">時刻の変更は、上の「時刻を指定」から。大津線の中の案内です。</div>
<button class="go" id="go">検索</button>
<div class="my" style="margin-top:14px"><b>マイ区間</b><span class="lnk" id="svr">＋ この区間を保存</span></div><div id="myr"></div></div></div>
<div id="r3" hidden><div class="rh"><span class="lnk" id="bk">‹ 戻る</span><div style="text-align:center;flex:1"><b id="rt1"></b><div class="s" id="rt2"></div></div><span style="width:44px"></span></div>
<div class="tabs"><span class="tbn on" data-o="a">早い順</span><span class="tbn dis">安い順</span><span class="tbn" data-o="t">乗換順(少)</span></div>
<div class="rtb" id="rtb"></div><div id="o3"></div></div></div>
</main>
<nav class="tb"><button id="b1" class="on">ホーム</button><button id="b3">乗換案内</button><button id="b2">列車走行位置</button></nav>
<div id="sh"><div id="shb"></div></div>
<script>
let D, R = {}, TR = [], HAMA = -1, useDelay = true, MY = [], cur = -1, more = false;
const $ = s => document.querySelector(s);
const fmt = m => { m = Math.round(m); return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); };
const DIR = { to_ishiyama: '石山寺方面', to_sakamoto: '坂本比叡山口方面', up: '太秦天神川方面', down: 'びわ湖浜大津方面' };
// 現在時刻（分）。深夜0〜4時は24時台の続きとして扱う
function now() {
  const v = $('#tm').value; let h, m, s = 0;
  if (v) [h, m] = v.split(':').map(Number); else { const d = new Date(); h = d.getHours(); m = d.getMinutes(); s = d.getSeconds(); }
  let t = h * 60 + m + s / 60; if (h < 4) t += 1440; return t;
}
// 投稿された遅れ(分)は、その停車駅以降すべてに引き継ぐ
const dl = (tr, k) => { const r = R[tr[0]]; return r && k >= r.k ? r.min : 0; };
function locate(tr, t) {
  const T = tr[6], n = T.length;
  if (t < T[0] || t >= T[n - 1] + dl(tr, n - 1)) return null;
  if (t < T[0] + dl(tr, 0)) return { k: 0, w: 1 };
  for (let k = 0; k < n - 1; k++) {
    const a = T[k] + dl(tr, k), b = T[k + 1] + dl(tr, k + 1);
    if (a <= t && t < b) return { k, f: (t - a) / (b - a || 1), eta: b };
  }
  return null;
}
const dlb = (tr, k) => useDelay ? dl(tr, k) : 0;
function loadMy() {
  try { MY = JSON.parse(localStorage.getItem('ll_my') || '[]'); } catch (e) { MY = []; }
  MY = MY.filter(i => D.stations[i]); if (!MY.length) MY = [HAMA]; cur = MY[0];
}
function saveMy() { try { localStorage.setItem('ll_my', JSON.stringify(MY)); } catch (e) {} }
const nmS = i => D.stations[i][1];
function board() {
  const t = now(), g = {}; let late = 0;
  for (const tr of TR) {
    const S = tr[5], T = tr[6];
    for (let k = 0; k < S.length - 1; k++) if (S[k] === cur) {
      const e = T[k] + dlb(tr, k);
      if (e >= t - 0.5) { (g[tr[1] + '_' + tr[2]] ??= []).push([e, T[k], tr]); if (Math.round(e - T[k])) late++; }
    }
  }
  $('#chips').innerHTML = MY.map(i => `<span class="chip${i === cur ? ' on' : ''}" data-si="${i}">${nmS(i)}${i === cur && MY.length > 1 ? `<i data-rm="${i}">×</i>` : ''}</span>`).join('');
  const keys = Object.keys(g).sort();
  let c = `<div class="card"><div class="ch"><b>${nmS(cur)}</b>${late ? `<span class="badge">▲ 遅れ等 ${late}件</span>` : ''}<label class="s tg">遅れ反映 <input type="checkbox" id="ud"${useDelay ? ' checked' : ''}></label></div>`;
  for (const key of keys) {
    const [li, di] = key.split('_').map(Number);
    c += `<div class="band">${D.lines[li][1]}　${DIR[D.dirs[di]]}</div>`;
    for (const [e, s0, tr] of g[key].sort((a, b) => a[0] - b[0]).slice(0, more ? 8 : 3)) {
      const d = Math.round(e - s0), ahead = tr[4] >= 0 && tr[5].indexOf(HAMA) >= tr[5].indexOf(cur);
      c += `<div class="rw" data-tr="${tr[0]}"><div class="tm">${d ? `<s>${fmt(s0)}</s>` : ''}<b class="${d ? 'late' : ''}">${fmt(e)}</b></div><div style="flex:1">${D.heads[tr[3]]}行<div class="s">${ahead ? D.notes[tr[4]] : ''}${tr[8] >= 0 ? ` <span class="late">${D.snotes[tr[8]]}</span>` : ''}</div></div><span class="s">›</span></div>`;
    }
  }
  if (!keys.length) c += '<p class="s" style="padding:10px 12px">これから出る列車はありません（終点、または運行終了）。</p>';
  c += `<button class="wide" id="more">${more ? '閉じる' : '▾ さらに見る'}</button><button class="wide" id="tt">時刻表</button></div>`;
  $('#clk').textContent = `${Math.floor(t / 60) % 24}時${String(Math.floor(t % 60)).padStart(2, '0')}分 現在`;
  $('#o1').innerHTML = c;
}
function dayList(si) {
  const g = {};
  for (const tr of TR) { const S = tr[5]; for (let k = 0; k < S.length - 1; k++) if (S[k] === si) (g[tr[1] + '_' + tr[2]] ??= []).push([tr[6][k], tr[0]]); }
  let h = `<span id="x" style="float:right;padding:0 6px;font-size:22px;cursor:pointer">✕</span><b>${nmS(si)}　時刻表</b><p class="s">時刻をタップすると、その列車の全駅の時刻が出ます。</p>`;
  for (const key of Object.keys(g).sort()) {
    const [li, di] = key.split('_').map(Number);
    h += `<h2>${D.lines[li][1]}　${DIR[D.dirs[di]]}</h2><div class="gr">${g[key].sort((a, b) => a[0] - b[0]).map(([m, id]) => `<span data-tr="${id}">${fmt(m)}</span>`).join('')}</div>`;
  }
  $('#shb').innerHTML = h; $('#sh').classList.add('on');
}
const GAP = 46, TOP = 26, UP = ['to_ishiyama', 'up'], BXS = [540, 170];
function trains() {
  const t = now(), nm = i => D.stations[i][1], HI = D.lines[1][2].indexOf(HAMA);
  const offs = [HI - (D.lines[0][2].length - 1), 0], H = TOP * 2 + GAP * 20;   // 京津線は、浜大津の高さを石山坂本線に合わせて置く
  const hy = TOP + HI * GAP; let g = `<line x1="${BXS[1]}" y1="${hy}" x2="${BXS[0]}" y2="${hy}" stroke="#bbb" stroke-width="5" stroke-dasharray="4 4"/>`, total = 0, cap = '';
  D.lines.forEach((L, li) => {
    const BX = BXS[li], pos = {}, items = []; L[2].forEach((x, i) => pos[x] = i + offs[li]);
    for (const tr of TR) {
      if (tr[1] !== li) continue;
      const p = locate(tr, t); if (!p) continue;
      const a = pos[tr[5][p.k]], b = p.w ? a : pos[tr[5][p.k + 1]];
      items.push({ tr, p, up: UP.includes(D.dirs[tr[2]]), y: TOP + (a + (b - a) * (p.f || 0)) * GAP });
    }
    total += items.length; items.sort((u, v) => u.y - v.y);
    const cols = [[], []];
    for (const it of items) {
      const sd = it.up ? 0 : 1, c = cols[sd]; let k = 0;
      while (c[k] !== undefined && it.y - c[k] < 52) k++;
      c[k] = it.y; it.x = BX + (sd ? 34 + k * 36 : -34 - k * 36);
    }
    const y0 = TOP + offs[li] * GAP, y1 = TOP + (L[2].length - 1 + offs[li]) * GAP;
    g += `<line x1="${BX}" y1="${y0}" x2="${BX}" y2="${y1}" stroke="${LC[li]}" stroke-width="12" stroke-linecap="round"/><text x="${BX}" y="${y0 - 16}" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">${L[1]}</text>`;
    L[2].forEach((si, i) => {
      const y = TOP + (i + offs[li]) * GAP;
      g += `<circle cx="${BX}" cy="${y}" r="9" fill="#fff" stroke="${LC[li]}" stroke-width="4"/><text x="${BX - 164}" y="${y + 5}" font-size="13" fill="currentColor">${nm(si)}</text>`;
    });
    for (const it of items) {
      const { x, y, up, tr } = it, d = dl(tr, it.p.k);
      g += `<g data-tr="${tr[0]}" style="cursor:pointer"><rect x="${x - 14}" y="${y - 17}" width="28" height="34" rx="9" fill="${LC[li]}" stroke="rgba(0,0,0,.3)"/><rect x="${x - 8}" y="${y - 11}" width="16" height="9" rx="2" fill="#fff" opacity=".9"/><path d="${up ? `M${x - 6} ${y - 24}h12l-6 -9z` : `M${x - 6} ${y + 24}h12l-6 9z`}" fill="#f0902f"/>${d ? `<text x="${x}" y="${up ? y + 34 : y - 22}" text-anchor="middle" font-size="14" font-weight="700" fill="#f0902f">+${d}</text>` : ''}</g>`;
    }
    cap += `<br>${L[1]}：▲ ${nm(L[2][0])}方面（左）　▼ ${nm(L[2][L[2].length - 1])}方面（右）`;
  });
  $('#o2').innerHTML = `<h2>走行中の列車（${total}本）</h2><p class="s">列車をタップすると、全駅の時刻が出ます。${cap}</p><div class="dg" style="overflow-x:auto"><svg viewBox="0 0 680 ${H}" role="img" aria-label="大津線の列車位置" style="display:block;width:100%;min-width:620px;max-width:760px;margin:0 auto">${g}</svg></div>`;
}
function sheet(id) {
  const tr = TR.find(x => x[0] === id), t = now(), p = locate(tr, t), S = tr[5], T = tr[6], n = S.length;
  const cur = p ? p.k : -1, done = !p && t >= T[n - 1], nm = k => D.stations[S[k]][1];
  const d0 = p ? dl(tr, p.k) : 0;
  let h = `<span id="x" style="float:right;padding:0 6px;font-size:22px;cursor:pointer">✕</span><b>${D.lines[tr[1]][1]}　${D.heads[tr[3]]}行</b> <span class="s">#${tr[0]}　${DIR[D.dirs[tr[2]]]}</span>`;
  h += `<div class="s">${p ? (p.w ? nm(0) + ' で発車待ち' : nm(p.k) + ' → ' + nm(p.k + 1) + ' を走行中') : (done ? '運行を終えました' : 'まだ出発していません')}${tr[4] >= 0 ? '<br>' + D.notes[tr[4]] : ''}${tr[8] >= 0 ? '<br>' + D.snotes[tr[8]] : ''}</div>`;
  h += `<p class="s">この列車の遅れ（この画面のみ）： <select id="dsel" data-id="${tr[0]}" data-k="${Math.max(cur, 0)}"><option value="0">遅れなし</option>${[1, 2, 3, 5, 10, 15, 20].map(x => `<option value="${x}"${d0 === x ? ' selected' : ''}>+${x}分</option>`).join('')}</select></p>`;
  S.forEach((si, k) => {
    const d = dl(tr, k), e = T[k] + d;
    h += `<div class="st${done || k < cur ? ' past' : ''}${k === cur ? ' now' : ''}"><span>${nm(k)}${k === n - 1 ? '（終点・到着は推定）' : ''}</span><span>${fmt(e)}${d ? ` <span class="late">+${d}</span>` : ''}</span></div>`;
  });
  $('#shb').innerHTML = h; $('#sh').classList.add('on');
}
// 日本の祝日（春分・秋分は計算式、振替休日、国民の休日を含む）
function jpBase(y, m, d) {
  const nth = (mm, n) => 1 + ((1 - new Date(y, mm - 1, 1).getDay() + 7) % 7) + (n - 1) * 7;
  const eq = c => Math.floor(c + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
  if (m === 1) return d === 1 || d === nth(1, 2);
  if (m === 2) return d === 11 || d === 23;
  if (m === 3) return d === eq(20.8431);
  if (m === 4) return d === 29;
  if (m === 5) return d >= 3 && d <= 5;
  if (m === 7) return d === nth(7, 3);
  if (m === 8) return d === 11;
  if (m === 9) return d === nth(9, 3) || d === eq(23.2488);
  if (m === 10) return d === nth(10, 2);
  if (m === 11) return d === 3 || d === 23;
  return false;
}
function jpHol(dt) {
  const f = x => jpBase(x.getFullYear(), x.getMonth() + 1, x.getDate()), day = n => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n);
  if (f(dt)) return true;
  if (dt.getDay() === 0) return false;
  for (let k = 1; k < 8; k++) { const p = day(-k); if (!f(p)) break; if (p.getDay() === 0) return true; }
  return f(day(-1)) && f(day(1));
}
function autoDay() {
  const n = new Date(); if (n.getHours() < 4) n.setDate(n.getDate() - 1);
  const w = n.getDay(), m = n.getMonth() + 1, d = n.getDate();
  return (w === 0 || w === 6 || jpHol(n) || (m === 12 && d >= 29) || (m === 1 && d <= 3)) ? 'holiday' : 'weekday';
}
function setDay() {
  const v = $('#dy').value, k = v || autoDay(), di = Math.max(0, D.days.findIndex(x => x[0] === k));
  TR = D.trips.filter(t => t[7] === di);
  $('#dayinfo').innerHTML = `いまは<b>${D.days[di][1]}ダイヤ</b>で表示しています${v ? '（手動で選択）' : '（日付から自動で判定。祝日・年末年始は土休日扱い）'}。臨時ダイヤの日は実際と異なります。遅れの入力は、この画面の中だけで反映され、他の人には共有されません。`;
}
// 乗換案内: 全列車の「駅→次の駅」を時刻順に走査して、最も早く着く経路を求める
const XFER = { default: 1, 'biwako-hamaotsu': 1 };   // 乗換に必要な分。浜大津は1分（指定）。他の駅は調査後に更新する
const xf = s => XFER[D.stations[s][0]] ?? XFER.default;
const DWELL = { 'biwako-hamaotsu': 1 };   // 停車時間（分）。時刻表には発車時刻しかないので、到着は発車の何分前とみなすか。浜大津は本家の結果と合わせた値
const dw = s => DWELL[D.stations[s][0]] ?? 0;
const LC = ['#7FCDD1', '#8DB987'];         // 路線の印の色（京津線、石山坂本線）
let RES = [], ord = 'a', AB = [0, 0], MR = [];
function route(a, b, t0) {
  const C = [];
  for (const tr of TR) { const S = tr[5], T = tr[6]; for (let k = 0; k < S.length - 1; k++) C.push({ tr, f: S[k], t: S[k + 1], d: T[k] + dlb(tr, k), a: T[k + 1] + dlb(tr, k + 1) - (k + 1 < S.length - 1 ? dw(S[k + 1]) : 0) }); }
  C.sort((x, y) => x.d - y.d);
  const arr = { [a]: t0 }, pred = {}, on = {}, bd = {};
  for (const c of C) {
    const id = c.tr[0];
    if (!on[id]) {
      if (arr[c.f] === undefined || c.d < arr[c.f] + (c.f === a && !pred[c.f] ? 0 : xf(c.f))) continue;
      on[id] = true; bd[id] = { c, prev: pred[c.f] || null };
    }
    if (c.a < (arr[c.t] ?? 1e9)) { arr[c.t] = c.a; pred[c.t] = c; }
  }
  if (arr[b] === undefined || !pred[b]) return null;
  const legs = []; let c = pred[b];
  while (c) { const o = bd[c.tr[0]]; legs.unshift({ tr: c.tr, from: o.c.f, dep: o.c.d, to: c.t, arr: c.a }); c = o.prev; }
  return legs;
}
const arrOf = L => L[L.length - 1].arr;
function search() {
  const a = +$('#fr').value, b = +$('#to').value; AB = [a, b]; RES = [];
  if (a !== b) {
    let t = now(); const seen = new Set();
    for (let i = 0; i < 6; i++) {
      const L = route(a, b, t); if (!L) break;
      const key = L[0].dep + '_' + arrOf(L); if (seen.has(key)) break;
      seen.add(key); RES.push(L); t = L[0].dep + 0.5;
    }
  }
  $('#f3').hidden = true; $('#r3').hidden = false; showRes();
}
function showRes() {
  const nm = i => D.stations[i][1], n = new Date(); if (n.getHours() < 4) n.setDate(n.getDate() - 1);
  $('#rt1').textContent = nm(AB[0]) + ' → ' + nm(AB[1]);
  $('#rt2').textContent = `${n.getMonth() + 1}月${n.getDate()}日(${'日月火水木金土'[n.getDay()]}) ${fmt(now())} 出発`;
  $('#rtb').textContent = 'リアルタイム経路検索 ' + (useDelay ? 'ON' : 'OFF');
  document.querySelectorAll('.tbn[data-o]').forEach(e => e.classList.toggle('on', e.dataset.o === ord));
  const R2 = RES.map((L, i) => [L, i]).sort((x, y) => (ord === 't' ? x[0].length - y[0].length : 0) || arrOf(x[0]) - arrOf(y[0]) || x[0][0].dep - y[0][0].dep);
  $('#o3').innerHTML = R2.map(([L, i]) => `<div class="rc" data-ri="${i}"><div class="tt">${fmt(L[0].dep)} - ${fmt(arrOf(L))}</div><div class="mt">⏱ ${Math.round(arrOf(L) - L[0].dep)}分　⇄ 乗換 ${L.length - 1}回</div>${L.map(g => `<span class="lg" style="background:${LC[g.tr[1]]};color:#16322e">🚃 ${D.lines[g.tr[1]][1]}</span>`).join('')}</div>`).join('') || '<p class="s">この時刻以降に、大津線の中で行ける経路がありません。</p>';
}
function routeSheet(i) {
  const L = RES[i], nm = x => D.stations[x][1];
  let h = `<span id="x" style="float:right;padding:0 6px;font-size:22px;cursor:pointer">✕</span><b>${fmt(L[0].dep)} - ${fmt(arrOf(L))}</b> <span class="s">${Math.round(arrOf(L) - L[0].dep)}分 ／ 乗換 ${L.length - 1}回</span>`;
  L.forEach((g, k) => {
    h += (k ? `<p class="s" style="margin:4px 0 4px 12px">↳ ${nm(g.from)}で乗換（${xf(g.from)}分以上）</p>` : '') +
      `<div class="rw" data-tr="${g.tr[0]}"><div class="tm"><b>${fmt(g.dep)}</b></div><div style="flex:1">${nm(g.from)} → ${nm(g.to)}<div class="s">${D.lines[g.tr[1]][1]}　${D.heads[g.tr[3]]}行　${fmt(g.arr)}着</div></div><span class="s">›</span></div>`;
  });
  $('#shb').innerHTML = h; $('#sh').classList.add('on');
}
function loadMR() { try { MR = JSON.parse(localStorage.getItem('ll_rt') || '[]'); } catch (e) { MR = []; } MR = MR.filter(r => D.stations[r[0]] && D.stations[r[1]]); }
function saveMR() { try { localStorage.setItem('ll_rt', JSON.stringify(MR)); } catch (e) {} drawMR(); }
function drawMR() {
  $('#myr').innerHTML = MR.map((r, i) => `<div class="rw" data-mr="${i}"><div style="flex:1">${D.stations[r[0]][1]} - ${D.stations[r[1]][1]}</div><span class="s" data-rm3="${i}" style="padding:0 8px">×</span></div>`).join('') || '<p class="s">まだありません。</p>';
}
const render = () => { if (!D) return; setDay(); board(); trains(); $('#tmv').textContent = $('#tm').value ? '⏱ ' + $('#tm').value + ' 出発' : '⏱ 現在時刻'; };
function show(n) {
  for (const i of [1, 2, 3]) { $('#p' + i).hidden = i !== n; $('#b' + i).classList.toggle('on', i === n); }
}
fetch('timetable.json').then(r => r.json()).then(j => {
  D = j; HAMA = D.stations.findIndex(x => x[0] === 'biwako-hamaotsu'); const seen = new Set(); let h = '';
  for (const L of D.lines) {
    h += `<optgroup label="${L[1]}">`;
    for (const i of L[2]) if (!seen.has(i)) { seen.add(i); h += `<option value="${i}">${D.stations[i][1]}</option>`; }
    h += '</optgroup>';
  }
  $('#st').innerHTML = '<option value="" selected disabled>駅を選ぶ…</option>' + h; $('#fr').innerHTML = h; $('#to').innerHTML = h; $('#to').selectedIndex = $('#to').options.length - 1; loadMy(); loadMR(); drawMR(); render(); setInterval(render, 15000);
}).catch(() => { $('#o1').textContent = 'timetable.json を読み込めません。サーバー経由（GitHub Pages など）で開いてください。'; });
$('#tm').oninput = $('#dy').onchange = render; $('#rf').onclick = render;
$('#b1').onclick = () => show(1); $('#b2').onclick = () => show(2); $('#b3').onclick = () => show(3);
$('#go').onclick = search; $('#sw').onclick = () => { const x = $('#fr').value; $('#fr').value = $('#to').value; $('#to').value = x; };
const tap = e => { const el = e.target.closest('[data-tr]'); if (el) sheet(+el.dataset.tr); };
$('#o2').onclick = tap;
$('#f3').onclick = e => {
  const t = e.target, r = t.closest('[data-mr]');
  if (t.id === 'svr') { const a = +$('#fr').value, b = +$('#to').value; if (a !== b && !MR.some(x => x[0] === a && x[1] === b)) { MR.push([a, b]); saveMR(); } }
  else if (t.dataset.rm3 !== undefined) { MR.splice(+t.dataset.rm3, 1); saveMR(); }
  else if (r) { const x = MR[+r.dataset.mr]; $('#fr').value = x[0]; $('#to').value = x[1]; search(); }
};
$('#r3').onclick = e => {
  const t = e.target, c = t.closest('[data-ri]');
  if (t.id === 'bk') { $('#r3').hidden = true; $('#f3').hidden = false; }
  else if (t.id === 'rtb') { useDelay = !useDelay; render(); search(); }
  else if (t.dataset.o) { ord = t.dataset.o; showRes(); }
  else if (c) routeSheet(+c.dataset.ri);
};
$('#shb').addEventListener('click', e => { const el = e.target.closest('[data-tr]'); if (el) sheet(+el.dataset.tr); });
$('#p1').onclick = e => {
  const t = e.target, c = t.closest('[data-si]'), tr = t.closest('[data-tr]');
  if (t.id === 'more') { more = !more; board(); }
  else if (t.id === 'tt') dayList(cur);
  else if (t.id === 'addb') $('#addp').hidden = !$('#addp').hidden;
  else if (t.dataset.rm) { const r = +t.dataset.rm; MY = MY.filter(x => x !== r); if (!MY.length) MY = [HAMA]; cur = MY[0]; saveMy(); board(); }
  else if (c) { cur = +c.dataset.si; board(); }
  else if (tr) sheet(+tr.dataset.tr);
};
$('#p1').onchange = e => {
  if (e.target.id === 'ud') { useDelay = e.target.checked; board(); }
  else if (e.target.id === 'st' && e.target.value) { const i = +e.target.value; if (!MY.includes(i)) MY.push(i); cur = i; saveMy(); $('#addp').hidden = true; board(); }
};
$('#sh').onclick = e => { if (e.target.id === 'sh' || e.target.id === 'x') $('#sh').classList.remove('on'); };
$('#shb').onchange = e => {
  const x = e.target; if (!x.dataset.id) return;
  const m = +x.value; if (m) R[x.dataset.id] = { k: +x.dataset.k, min: m }; else delete R[x.dataset.id];
  render(); sheet(+x.dataset.id);
};
